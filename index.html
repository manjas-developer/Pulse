<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse — Your campus, in sync</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { darkMode:'class', theme:{ extend:{ fontFamily:{sans:['Plus Jakarta Sans','sans-serif']}, colors:{brand:{50:'#eef2ff',100:'#e0e7ff',500:'#6366f1',600:'#4f46e5',700:'#4338ca'},campus:{teal:'#0d9488',rose:'#e11d48',amber:'#d97706'}}, boxShadow:{card:'0 12px 35px -24px rgba(15,23,42,.45)'} } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{background:#f8fafc}.dark body{background:#020617}.sidebar{height:calc(100vh - 2rem)}.feed{max-width:680px}.app-shell{max-width:1440px}.cover{background:linear-gradient(120deg,#312e81 0%,#4f46e5 45%,#0d9488 100%)}@media(max-width:1023px){.sidebar{display:none}.mobile-nav{display:flex}}@media(min-width:1024px){.mobile-nav{display:none}}@media(max-width:640px){.app-shell{padding:0}.topbar{border-radius:0}.composer,.post-card{border-radius:0;border-left:0;border-right:0}.main{padding-bottom:5rem}}
  </style>
</head>
<body class="min-h-full text-slate-800 dark:text-slate-100 font-sans antialiased">
  <div class="app-shell mx-auto min-h-screen lg:px-4 lg:py-4">
    <div class="grid lg:grid-cols-[240px_minmax(0,680px)_300px] gap-6 items-start">
      <aside class="sidebar hidden lg:flex flex-col sticky top-4 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 shadow-card">
        <a href="#" onclick="showFeed();return false" class="flex items-center gap-3 mb-8"><span class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-campus-teal text-white grid place-items-center shadow-lg"><i data-lucide="zap" class="fill-white"></i></span><span><b class="text-xl tracking-tight">Pulse</b><small class="block text-[10px] uppercase tracking-[.2em] text-slate-400">Campus</small></span></a>
        <nav class="space-y-1 text-sm font-semibold">
          <button onclick="showFeed()" class="nav-item active"><i data-lucide="home"></i> Home</button>
          <button onclick="focusComposer()" class="nav-item"><i data-lucide="plus-square"></i> Create pulse</button>
          <button onclick="openMessages()" class="nav-item"><i data-lucide="message-circle"></i> Messages <span class="ml-auto rounded-full bg-brand-100 text-brand-700 px-2 text-[10px]">2</span></button>
          <button onclick="openNotifications()" class="nav-item"><i data-lucide="bell"></i> Notifications</button>
          <button onclick="showProfile()" class="nav-item"><i data-lucide="user"></i> My profile</button>
        </nav>
        <div class="mt-auto rounded-2xl cover text-white p-4"><p class="text-xs font-bold">Make campus better together.</p><p class="text-[11px] text-white/70 mt-1">Share notes, find your people, stay in sync.</p></div>
      </aside>

      <main class="main min-w-0">
        <header class="topbar sticky top-0 z-30 mb-4 flex items-center gap-3 rounded-3xl bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border border-slate-200 dark:border-slate-800 px-4 py-3 shadow-card">
          <a href="#" onclick="showFeed();return false" class="lg:hidden flex items-center gap-2 font-extrabold"><span class="w-8 h-8 rounded-xl bg-gradient-to-tr from-brand-600 to-campus-teal text-white grid place-items-center"><i data-lucide="zap" class="w-4 h-4 fill-white"></i></span>Pulse</a>
          <div class="relative flex-1"><i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i><input id="search" oninput="handleSearch(this.value)" placeholder="Search pulses, people, topics" class="w-full rounded-2xl bg-slate-100 dark:bg-slate-800 border-0 pl-10 pr-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500"></div>
          <button onclick="toggleTheme()" class="icon-btn" title="Toggle theme"><i id="theme-icon" data-lucide="moon"></i></button>
          <button onclick="openNotifications()" class="icon-btn relative" title="Notifications"><i data-lucide="bell"></i><span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-campus-rose"></span></button>
          <button onclick="showProfile()" class="rounded-full ring-2 ring-brand-500/30 p-0.5"><img id="top-avatar" class="w-8 h-8 rounded-full" src="https://api.dicebear.com/7.x/bottts/svg?seed=student" alt="Profile"></button>
        </header>

        <section class="cover rounded-3xl p-6 sm:p-8 text-white mb-5 overflow-hidden relative"><div class="relative z-10"><p class="text-sm font-semibold text-white/70">Tuesday · 25 September</p><h1 class="mt-2 text-2xl sm:text-3xl font-extrabold tracking-tight">Good morning, <span id="greeting-name">student</span> 👋</h1><p class="mt-2 max-w-md text-sm text-white/75">What’s happening on campus today?</p><button onclick="focusComposer()" class="mt-5 inline-flex items-center gap-2 rounded-xl bg-white text-brand-700 px-4 py-2.5 text-sm font-bold hover:bg-brand-50 transition"><i data-lucide="plus" class="w-4 h-4"></i> Share an update</button></div><i data-lucide="sparkles" class="absolute -right-3 -bottom-8 w-44 h-44 text-white/10"></i></section>

        <section id="composer" class="composer bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-4 shadow-card mb-5"><div class="flex gap-3"><img id="composer-avatar" class="w-10 h-10 rounded-full" src="https://api.dicebear.com/7.x/bottts/svg?seed=student" alt=""><textarea id="composer-text" rows="2" placeholder="Share something with your campus..." class="flex-1 resize-none bg-transparent outline-none text-sm pt-2"></textarea></div><div class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-800 flex justify-between items-center"><div class="flex gap-1"><button class="tool-btn" onclick="addTag()"><i data-lucide="hash"></i><span class="hidden sm:inline">Topic</span></button><button class="tool-btn" onclick="togglePoll()"><i data-lucide="bar-chart-3"></i><span class="hidden sm:inline">Poll</span></button><label class="tool-btn cursor-pointer"><i data-lucide="image"></i><span class="hidden sm:inline">Photo</span><input type="file" accept="image/*" class="hidden" onchange="attachImage(event)"></label></div><button onclick="publishPost()" class="rounded-xl bg-brand-600 hover:bg-brand-700 text-white px-5 py-2 text-sm font-bold transition">Post pulse</button></div><div id="poll-box" class="hidden mt-3 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800 space-y-2"><input id="poll-question" placeholder="Ask your campus..." class="field"><input id="poll-option" placeholder="First option" class="field"></div></section>

        <div class="flex items-center justify-between mb-3"><div class="flex gap-1 rounded-2xl bg-slate-200/70 dark:bg-slate-800 p-1"><button id="filter-all" onclick="setFilter('all')" class="filter active">All</button><button id="filter-homework" onclick="setFilter('homework')" class="filter">Homework</button><button id="filter-polls" onclick="setFilter('polls')" class="filter">Polls</button></div><button onclick="renderFeed()" class="icon-btn" title="Refresh"><i data-lucide="refresh-cw"></i></button></div>
        <section id="feed" class="space-y-4"></section>
      </main>

      <aside class="hidden lg:block sticky top-4 space-y-4">
        <section class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 shadow-card"><div class="flex justify-between items-center"><h2 class="font-extrabold">Campus moments</h2><button class="text-xs text-brand-600 font-bold">See all</button></div><div id="stories" class="mt-4 flex gap-3 overflow-hidden"></div></section>
        <section class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 shadow-card"><h2 class="font-extrabold">People to connect</h2><div id="people" class="mt-4 space-y-4"></div></section>
        <p class="px-2 text-[11px] text-slate-400">Pulse · A calmer campus community<br>Made for students, by students.</p>
      </aside>
    </div>
  </div>
  <nav class="mobile-nav fixed bottom-0 inset-x-0 z-40 hidden justify-around border-t border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl px-3 py-2"><button onclick="showFeed()" class="mobile-item active"><i data-lucide="home"></i><span>Home</span></button><button onclick="focusComposer()" class="mobile-item"><i data-lucide="plus-circle"></i><span>Create</span></button><button onclick="openMessages()" class="mobile-item"><i data-lucide="message-circle"></i><span>Chat</span></button><button onclick="showProfile()" class="mobile-item"><i data-lucide="user"></i><span>Profile</span></button></nav>
  <div id="modal" class="hidden fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm items-center justify-center p-4"><div class="w-full max-w-sm rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 shadow-2xl"><div class="flex justify-between items-center"><h2 id="modal-title" class="font-extrabold text-lg">Welcome to Pulse</h2><button onclick="closeModal()" class="icon-btn"><i data-lucide="x"></i></button></div><div id="modal-content" class="mt-5"></div></div></div>
  <div id="toast" class="fixed bottom-20 lg:bottom-6 left-1/2 -translate-x-1/2 z-[60] hidden rounded-2xl bg-slate-900 text-white px-4 py-3 text-sm font-semibold shadow-xl"></div>
  <script>
    const users=[{name:'Ava Chen',handle:'@ava',grade:'11th',avatar:'https://api.dicebear.com/7.x/bottts/svg?seed=ava'},{name:'Milo Brooks',handle:'@milo',grade:'10th',avatar:'https://api.dicebear.com/7.x/bottts/svg?seed=milo'},{name:'Sofia Nguyen',handle:'@sofia',grade:'12th',avatar:'https://api.dicebear.com/7.x/bottts/svg?seed=sofia'}];
    let posts=[{id:1,name:'Ava Chen',handle:'@ava',avatar:users[0].avatar,time:'12m',tag:'homework',text:'Does anyone have the chemistry review sheet for Friday? I can trade notes for a quick recap on cell transport.',likes:24,comments:6},{id:2,name:'Milo Brooks',handle:'@milo',avatar:users[1].avatar,time:'28m',tag:'campus',text:'Study group at the library after school — bringing snacks and diagrams. Anyone want in?',likes:18,comments:3},{id:3,name:'Sofia Nguyen',handle:'@sofia',avatar:users[2].avatar,time:'1h',tag:'polls',text:'Best place to recharge between classes?',likes:31,comments:9,poll:['Library patio','Cafe','Greenhouse']}];
    let filter='all',query='',attachedImage='';
    const $=id=>document.getElementById(id);
    function init(){renderFeed();renderStories();renderPeople();lucide.createIcons();const saved=localStorage.getItem('pulse-theme');if(saved==='dark')toggleTheme();}
    function renderFeed(){const list=posts.filter(p=>(filter==='all'||p.tag===filter)&&(!query||`${p.name} ${p.handle} ${p.text}`.toLowerCase().includes(query)));$('feed').innerHTML=list.map(p=>`<article class="post-card rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 shadow-card"><div class="flex gap-3"><img src="${p.avatar}" class="w-10 h-10 rounded-full"><div class="flex-1"><div class="flex justify-between gap-3"><div><b class="text-sm">${p.name}</b><p class="text-xs text-slate-400">${p.handle} · ${p.time}</p></div><button class="text-slate-400"><i data-lucide="more-horizontal" class="w-4 h-4"></i></button></div><p class="mt-3 text-sm leading-6 text-slate-700 dark:text-slate-200">${p.text}</p>${p.poll?`<div class="mt-4 space-y-2">${p.poll.map(o=>`<button class="w-full text-left rounded-xl border border-slate-200 dark:border-slate-700 px-3 py-2 text-xs hover:border-brand-500 hover:bg-brand-50 dark:hover:bg-slate-800 transition">${o}</button>`).join('')}</div>`:''}${p.image?`<img src="${p.image}" class="mt-4 rounded-2xl max-h-80 w-full object-cover">`:''}<div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800 flex gap-5 text-xs text-slate-400"><button onclick="like(${p.id})" class="hover:text-rose-500 flex gap-1.5 items-center"><i data-lucide="heart" class="w-4 h-4"></i>${p.likes}</button><button onclick="toast('Comments are ready for your classmates')" class="hover:text-brand-600 flex gap-1.5 items-center"><i data-lucide="message-circle" class="w-4 h-4"></i>${p.comments}</button><button onclick="toast('Pulse link copied')" class="hover:text-brand-600 flex gap-1.5 items-center"><i data-lucide="share-2" class="w-4 h-4"></i>Share</button></div></div></div></article>`).join('')||`<div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-10 text-center"><i data-lucide="search-x" class="mx-auto text-slate-400"></i><h3 class="mt-3 font-bold">Nothing here yet</h3><p class="mt-1 text-sm text-slate-400">Try another search or start a new conversation.</p></div>`;lucide.createIcons();}
    function renderStories(){$('stories').innerHTML=users.map(u=>`<button class="shrink-0 text-center" onclick="toast('Opening ${u.name}’s story')"><div class="story-ring p-0.5 rounded-2xl"><img src="${u.avatar}" class="w-14 h-14 rounded-[14px] border-2 border-white dark:border-slate-900"></div><span class="block mt-1 text-[10px] font-semibold truncate w-14">${u.name.split(' ')[0]}</span></button>`).join('');}
    function renderPeople(){$('people').innerHTML=users.map(u=>`<div class="flex items-center gap-3"><img src="${u.avatar}" class="w-9 h-9 rounded-full"><div class="min-w-0 flex-1"><b class="block text-xs">${u.name}</b><span class="text-[10px] text-slate-400">${u.grade} · ${u.handle}</span></div><button onclick="toast('Connection request sent')" class="text-[11px] font-bold text-brand-600">Connect</button></div>`).join('');}
    function setFilter(f){filter=f;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));$('filter-'+f).classList.add('active');renderFeed();}
    function handleSearch(v){query=v.toLowerCase().trim();renderFeed();}
    function like(id){const p=posts.find(x=>x.id===id);if(p){p.likes++;renderFeed();}}
    function addTag(){const t=$('composer-text');t.value+=(t.value?' ':'')+'#HomeworkHelp';t.focus();}
    function togglePoll(){$('poll-box').classList.toggle('hidden');}
    function attachImage(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{attachedImage=r.result;toast('Photo attached')};r.readAsDataURL(f);}
    function publishPost(){const text=$('composer-text').value.trim();if(!text&&!attachedImage){toast('Write something before posting');return}posts.unshift({id:Date.now(),name:'You',handle:'@student',avatar:'https://api.dicebear.com/7.x/bottts/svg?seed=student',time:'now',tag:'campus',text:text||'Shared a new photo with campus.',likes:0,comments:0,image:attachedImage});$('composer-text').value='';attachedImage='';$('poll-box').classList.add('hidden');renderFeed();toast('Your pulse is live');}
    function focusComposer(){$('composer-text').focus();$('composer').scrollIntoView({behavior:'smooth',block:'center'});}
    function toggleTheme(){document.documentElement.classList.toggle('dark');localStorage.setItem('pulse-theme',document.documentElement.classList.contains('dark')?'dark':'light');$('theme-icon').setAttribute('data-lucide',document.documentElement.classList.contains('dark')?'sun':'moon');lucide.createIcons();}
    function showFeed(){window.scrollTo({top:0,behavior:'smooth'});closeModal();}
    function openMessages(){showModal('Messages',`<div class="space-y-3">${users.map(u=>`<button onclick="toast('Chat opened with ${u.name}')" class="w-full flex items-center gap-3 rounded-2xl p-3 text-left hover:bg-slate-100 dark:hover:bg-slate-800"><img src="${u.avatar}" class="w-10 h-10 rounded-full"><span><b class="block text-sm">${u.name}</b><small class="text-xs text-slate-400">Send a message</small></span></button>`).join('')}</div>`)}
    function openNotifications(){showModal('Notifications','<div class="space-y-3 text-sm"><p class="rounded-2xl bg-brand-50 dark:bg-slate-800 p-3">Sofia liked your pulse.</p><p class="rounded-2xl bg-emerald-50 dark:bg-slate-800 p-3">Your study group is ready.</p></div>')}
    function showProfile(){showModal('Your profile','<div class="text-center"><img class="mx-auto w-20 h-20 rounded-3xl" src="https://api.dicebear.com/7.x/bottts/svg?seed=student"><h3 class="mt-3 font-extrabold">Your campus profile</h3><p class="text-sm text-slate-400 mt-1">Tell classmates what you are working on.</p><button onclick="closeModal();focusComposer()" class="mt-5 w-full rounded-xl bg-brand-600 text-white py-2.5 text-sm font-bold">Share an update</button></div>')}
    function showModal(title,html){$('modal-title').textContent=title;$('modal-content').innerHTML=html;$('modal').classList.remove('hidden');$('modal').classList.add('flex');lucide.createIcons();}
    function closeModal(){$('modal').classList.add('hidden');$('modal').classList.remove('flex');}
    function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)}
    document.addEventListener('DOMContentLoaded',init);
  </script>
</body>
</html>
